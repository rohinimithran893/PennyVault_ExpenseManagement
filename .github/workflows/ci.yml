name: PennyVault CI

on:
  push:
    branches:
      - feature/render-deployment
      - feature/develop
  pull_request:
    branches:
      - feature/develop

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: PennyVault-Frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: PennyVault-Frontend
      - name: Build frontend
        run: npm run build
        working-directory: PennyVault-Frontend
      - name: Report npm dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const audit = require("./npm-audit.json"); console.log("npm audit summary:", JSON.stringify(audit.metadata?.vulnerabilities || {})); for (const [name, item] of Object.entries(audit.vulnerabilities || {})) { console.log([name, item.severity, "range=" + item.range, "fix=" + JSON.stringify(item.fixAvailable)].join(" | ")); }'
        working-directory: PennyVault-Frontend

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pennyvault_test
          POSTGRES_USER: pennyvault
          POSTGRES_PASSWORD: pennyvault_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pennyvault -d pennyvault_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/pennyvault_test
      SPRING_DATASOURCE_USERNAME: pennyvault
      SPRING_DATASOURCE_PASSWORD: pennyvault_ci_password
      JWT_SECRET: pennyvault-ci-only-secret-key-never-use-in-production-2026
      JPA_DDL_AUTO: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run backend tests
        run: ./mvnw -B verify
        working-directory: PennyVault-Backend
