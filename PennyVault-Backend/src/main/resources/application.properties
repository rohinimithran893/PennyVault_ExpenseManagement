spring.application.name=PennyVault-Backend

# Render supplies PORT at runtime; local development defaults to 8080.
server.port=${PORT:8080}

# Database: use a JDBC URL from Neon in deployed environments.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pennyVault}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rohini.subramanian}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema changes; Hibernate validates the migrated schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Supply a strong JWT secret through the deployment environment.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# SMTP remains available for local development. Render deployments use Microsoft Graph.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Frontend links and allowed browser origins.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Microsoft Graph delegated email configuration.
app.microsoft.graph.client-id=${MICROSOFT_GRAPH_CLIENT_ID:}
app.microsoft.graph.client-secret=${MICROSOFT_GRAPH_CLIENT_SECRET:}
app.microsoft.graph.tenant=${MICROSOFT_GRAPH_TENANT:consumers}
app.microsoft.graph.redirect-uri=${MICROSOFT_GRAPH_REDIRECT_URI:http://localhost:8080/oauth2/callback}
app.microsoft.graph.sender-email=${MICROSOFT_GRAPH_SENDER_EMAIL:}
app.microsoft.graph.scopes=${MICROSOFT_GRAPH_SCOPES:openid profile offline_access Mail.Send}
app.microsoft.graph.encryption-key=${MICROSOFT_GRAPH_ENCRYPTION_KEY:}

# Retain optional provider settings for compatibility with existing local/deployment configuration.
app.mail.from=${MAIL_FROM:${SMTP_FROM:}}
app.mail.resend-api-key=${RESEND_API_KEY:}

# Render health checks.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.mail.enabled=false
