spring.application.name=PennyVault-Backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/pennyVault
spring.datasource.username=rohini.subramanian
spring.datasource.password=

spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=MyVerySecureSecretKeyForPennyVaultApplication2026
jwt.expiration=86400000

# Gmail SMTP invitation email configuration.
# Keep the Gmail address and App Password in local environment variables, never in Git.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# Public frontend URL used in invitation acceptance links
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.mail.from=${SMTP_FROM:}
