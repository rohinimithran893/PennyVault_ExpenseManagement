spring.application.name=PennyVault-Backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/pennyVault
spring.datasource.username=rohini.subramanian
spring.datasource.password=

spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=MyVerySecureSecretKeyForPennyVaultApplication2026
jwt.expiration=86400000

# Invitation email (configure SMTP credentials through environment variables)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

# Public frontend URL used in invitation acceptance links
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.mail.from=${SMTP_FROM:no-reply@pennyvault.local}
