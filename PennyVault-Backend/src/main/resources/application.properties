spring.application.name=PennyVault-Backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/pennyVault
spring.datasource.username=rohini.subramanian
spring.datasource.password=

spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=MyVerySecureSecretKeyForPennyVaultApplication2026
jwt.expiration=86400000