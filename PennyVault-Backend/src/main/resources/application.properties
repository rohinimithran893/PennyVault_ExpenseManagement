spring.config.import=optional:file:.env[.properties]

spring.application.name=PennyVault-Backend

# Microsoft Graph Email Configuration
app.microsoft.graph.client-id=${MICROSOFT_GRAPH_CLIENT_ID:}
app.microsoft.graph.client-secret=${MICROSOFT_GRAPH_CLIENT_SECRET:}
app.microsoft.graph.tenant=${MICROSOFT_GRAPH_TENANT:consumers}
app.microsoft.graph.redirect-uri=${MICROSOFT_GRAPH_REDIRECT_URI:http://localhost:8080/oauth2/callback}
app.microsoft.graph.sender-email=${MICROSOFT_GRAPH_SENDER_EMAIL:}
app.microsoft.graph.scopes=${MICROSOFT_GRAPH_SCOPES:openid profile offline_access Mail.Send}
app.microsoft.graph.encryption-key=${MICROSOFT_GRAPH_ENCRYPTION_KEY:}

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/pennyVault
spring.datasource.username=rohini.subramanian
spring.datasource.password=

spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=MyVerySecureSecretKeyForPennyVaultApplication2026
jwt.expiration=86400000

# Gmail SMTP invitation email configuration.
# Keep the Gmail address and App Password in local environment variables, never in Git.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# Public frontend URL used in invitation acceptance links
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.mail.from=${SMTP_FROM:}
