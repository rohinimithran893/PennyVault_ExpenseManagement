spring.application.name=PennyVault-Backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/pennyVault
spring.datasource.username=rohini.subramanian
spring.datasource.password=

spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT signing key must be supplied externally as a Base64-encoded secret.
# Generate a new key with: openssl rand -base64 32
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
