services:
  - type: web
    name: pennyvault-backend
    runtime: docker
    plan: free
    region: singapore
    branch: feature/render-deployment
    dockerfilePath: ./PennyVault-Backend/Dockerfile
    dockerContext: ./PennyVault-Backend
    healthCheckPath: /actuator/health
    autoDeployTrigger: off
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JPA_DDL_AUTO
        value: validate
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=15.0 -XX:+UseSerialGC"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: pennyvault-frontend
    runtime: static
    branch: feature/render-deployment
    buildCommand: cd PennyVault-Frontend && npm ci && npm run build
    staticPublishPath: ./PennyVault-Frontend/build
    autoDeployTrigger: off
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE_URL
        sync: false
